# CI — Astra Arcana (Phase 5.3)
#
# Gates every push/PR on: backend tests, an app-boot smoke check, and the
# frontend typecheck+build. AAE_ENV must be set for any step that imports the
# app: main.py calls entitlements.assert_safe_boot() at import time and an
# unset AAE_ENV is treated as production (fail-closed), which refuses to boot
# with the default secret. pytest gets AAE_ENV from tests/conftest.py, but we
# set it explicitly here so the guard never depends on collection order.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend — pytest + boot smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      AAE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff — config in backend/pyproject.toml)
        run: |
          pip install ruff
          ruff check .
      - name: Run tests
        run: python -m pytest -q
      - name: Parity vectors byte-drift tripwire
        run: python tools/gen_parity_vectors.py --check
      - name: Gazetteer drift tripwire
        # Offline mode by design: the full check regenerates from a 5.4 MB
        # GeoNames dump, and making CI download it every run would be flaky and
        # rude. Without --source this re-derives the artifact's invariants and
        # content digest from the file itself, which catches the drift that
        # actually happens to a committed data file — corruption and hand-edits.
        run: python tools/gen_gazetteer.py --check
      - name: Boot smoke check (app imports, routes registered)
        run: |
          python -c "
          import main
          routes = [r.path for r in main.app.routes if r.path.startswith('/api')]
          assert len(routes) >= 30, f'route table shrank: {len(routes)}'
          print(f'ok: {len(routes)} /api routes')
          "
      - name: Prod boot guard still refuses insecure config
        # The fail-closed invariant itself, exercised on every CI run: with
        # AAE_ENV unset (= production) and the default secret, import must fail.
        run: |
          env -u AAE_ENV python -c "
          try:
              import main
          except RuntimeError as exc:
              assert 'AAE_SECRET' in str(exc)
              print('ok: boot refused insecure production config')
          else:
              raise SystemExit('boot guard FAILED to refuse insecure production config')
          "

  resonarium:
    name: Resonarium — Python↔JS seed parity
    runs-on: ubuntu-latest
    # The suite asserts that natal_seed.py and natal_seed.js derive identical
    # seeds. Until now nothing ran it automatically, so the claim was only ever
    # as true as the last time somebody remembered — and two real divergences
    # (JS toFixed going exponential at 1e21; Array.sort ordering by UTF-16 code
    # unit rather than code point) lived in it undetected. A cross-language
    # invariant that no job enforces is a comment, not a contract.
    #
    # Needs BOTH runtimes in one job: the parity tests shell out to node and
    # skip themselves silently when it is absent, which would turn a red build
    # into a quiet pass — the exact failure mode being closed here.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run the suite (stdlib only — no dependencies to install)
        run: python -m unittest discover -s resonarium/tests -v
      - name: Assert the node parity tests did NOT skip
        # A skip here means node went missing and the cross-substrate half of
        # the suite silently stopped running. Fail loudly instead.
        run: |
          python -m unittest discover -s resonarium/tests -v 2>&1 | tee /tmp/res.log
          if grep -qi "skipped" /tmp/res.log; then
            echo "::error::resonarium parity tests SKIPPED — node missing?"
            exit 1
          fi
          echo "ok: no skips, both substrates exercised"
      - name: Run the suite (stdlib only) and prove both substrates ran
        shell: bash
        run: |
          # pipefail is REQUIRED: piping into tee makes the pipeline's status
          # tee's, so without it a genuinely failing suite would exit 0 and
          # this gate would pass while the tests were red.
          set -o pipefail
          python -m unittest discover -s resonarium/tests -v 2>&1 | tee /tmp/res.log
          # Assert the cross-substrate test actually EXECUTED, rather than
          # grepping for the word "skipped" anywhere — that would false-trip on
          # any unrelated skip added later. The parity classes are gated on
          # `node` being present and skip themselves silently when it is not,
          # which would turn a red build into a quiet pass. Name the test.
          if ! grep -qE "test_battery_agrees_case_by_case.*ok" /tmp/res.log; then
            echo "::error::cross-substrate battery did not run (node missing?)"
            exit 1
          fi
          echo "ok: Python↔JS battery executed in both substrates"

  frontend:
    name: Frontend — tsc + vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install @astra/core deps (aliased into the build)
        # The build imports @astra/core from packages/astra-core/src; tsc and
        # Vite resolve its `astronomy-engine` dep from that package's own
        # node_modules, so it must be installed too.
        run: npm ci
        working-directory: packages/astra-core
      - name: Typecheck + build
        run: npm run build
      - name: Unit tests (offline gazetteer search)
        run: npm test

  astra-core:
    name: "@astra/core — parity vs golden vectors"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/astra-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/astra-core/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (strict)
        run: npm run typecheck
      - name: Parity vs parity/natal-chart.json
        run: npm test

  e2e:
    name: E2E — Playwright (desktop + mobile emulation)
    runs-on: ubuntu-latest
    env:
      # Development mode: boot guard permits the default secret, and the
      # minted test tokens validate against the same default-secret server.
      AAE_ENV: development
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install @astra/core deps (Vite bundles it for on-device casting)
        run: npm ci
        working-directory: packages/astra-core
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Pre-build backend venv (run.sh boots from .venv)
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.txt
      - name: Run e2e suite (boots run.sh itself)
        run: npm run e2e
        working-directory: frontend
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  secrets-scan:
    name: Gitleaks — secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # scan full history, not just the tip
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
