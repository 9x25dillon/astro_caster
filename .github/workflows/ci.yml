# CI — Astra Arcana (Phase 5.3)
#
# Gates every push/PR on: backend tests, an app-boot smoke check, and the
# frontend typecheck+build. AAE_ENV must be set for any step that imports the
# app: main.py calls entitlements.assert_safe_boot() at import time and an
# unset AAE_ENV is treated as production (fail-closed), which refuses to boot
# with the default secret. pytest gets AAE_ENV from tests/conftest.py, but we
# set it explicitly here so the guard never depends on collection order.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend — pytest + boot smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      AAE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff — config in backend/pyproject.toml)
        run: |
          pip install ruff
          ruff check .
      - name: Run tests
        run: python -m pytest -q
      - name: Reading eval suite (replay — no provider calls)
        # Quality gate on what the MODEL WROTE, not on the plumbing around it.
        # The rest of the suite mocks the provider, so it cannot see a truncated
        # reading, an invented placement, or a missing section — which is how
        # every supporter reading came to end mid-sentence unnoticed. Replays
        # recorded generations from evals/cassettes, so it costs nothing and is
        # deterministic. Re-record with `python -m evals.runner --record` after
        # changing a prompt, a model, or a token budget.
        run: python -m evals.runner

      - name: Parity vectors byte-drift tripwire
        run: python tools/gen_parity_vectors.py --check
      - name: Gazetteer drift tripwire
        # Offline mode by design: the full check regenerates from a 5.4 MB
        # GeoNames dump, and making CI download it every run would be flaky and
        # rude. Without --source this re-derives the artifact's invariants and
        # content digest from the file itself, which catches the drift that
        # actually happens to a committed data file — corruption and hand-edits.
        run: python tools/gen_gazetteer.py --check
      - name: Boot smoke check (app imports, routes registered)
        run: |
          python -c "
          import main
          routes = [r.path for r in main.app.routes if r.path.startswith('/api')]
          assert len(routes) >= 30, f'route table shrank: {len(routes)}'
          print(f'ok: {len(routes)} /api routes')
          "
      - name: Prod boot guard still refuses insecure config
        # The fail-closed invariant itself, exercised on every CI run: with
        # AAE_ENV unset (= production) and the default secret, import must fail.
        run: |
          env -u AAE_ENV python -c "
          try:
              import main
          except RuntimeError as exc:
              assert 'AAE_SECRET' in str(exc)
              print('ok: boot refused insecure production config')
          else:
              raise SystemExit('boot guard FAILED to refuse insecure production config')
          "

  resonarium:
    name: Resonarium — Python↔JS seed parity
    runs-on: ubuntu-latest
    # The suite asserts that natal_seed.py and natal_seed.js derive identical
    # seeds. Until now nothing ran it automatically, so the claim was only ever
    # as true as the last time somebody remembered — and two real divergences
    # (JS toFixed going exponential at 1e21; Array.sort ordering by UTF-16 code
    # unit rather than code point) lived in it undetected. A cross-language
    # invariant that no job enforces is a comment, not a contract.
    #
    # Needs BOTH runtimes in one job: the parity tests shell out to node and
    # skip themselves silently when it is absent, which would turn a red build
    # into a quiet pass — the exact failure mode being closed here.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run the suite (stdlib only — no dependencies to install)
        run: python -m unittest discover -s resonarium/tests -v
      - name: Assert the node parity tests did NOT skip
        # A skip here means node went missing and the cross-substrate half of
        # the suite silently stopped running. Fail loudly instead.
        run: |
          python -m unittest discover -s resonarium/tests -v 2>&1 | tee /tmp/res.log
          if grep -qi "skipped" /tmp/res.log; then
            echo "::error::resonarium parity tests SKIPPED — node missing?"
            exit 1
          fi
          echo "ok: no skips, both substrates exercised"
      - name: Run the suite (stdlib only) and prove both substrates ran
        shell: bash
        run: |
          # pipefail is REQUIRED: piping into tee makes the pipeline's status
          # tee's, so without it a genuinely failing suite would exit 0 and
          # this gate would pass while the tests were red.
          set -o pipefail
          python -m unittest discover -s resonarium/tests -v 2>&1 | tee /tmp/res.log
          # Assert the cross-substrate test actually EXECUTED, rather than
          # grepping for the word "skipped" anywhere — that would false-trip on
          # any unrelated skip added later. The parity classes are gated on
          # `node` being present and skip themselves silently when it is not,
          # which would turn a red build into a quiet pass. Name the test.
          if ! grep -qE "test_battery_agrees_case_by_case.*ok" /tmp/res.log; then
            echo "::error::cross-substrate battery did not run (node missing?)"
            exit 1
          fi
          echo "ok: Python↔JS battery executed in both substrates"

  frontend:
    name: Frontend — tsc + vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install @astra/core deps (aliased into the build)
        # The build imports @astra/core from packages/astra-core/src; tsc and
        # Vite resolve its `astronomy-engine` dep from that package's own
        # node_modules, so it must be installed too.
        run: npm ci
        working-directory: packages/astra-core
      - name: Typecheck + build
        run: npm run build
      - name: Unit tests (offline gazetteer search)
        run: npm test

  astra-core:
    name: "@astra/core — parity vs golden vectors"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/astra-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/astra-core/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (strict)
        run: npm run typecheck
      - name: Parity vs parity/natal-chart.json
        run: npm test

  boundary-parity:
    name: "A2 — boundary-adversarial parity + tolerance ratchet"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The ratchet diffs the contract against the merge-base, so it needs
          # history rather than a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/astra-core/package-lock.json
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install @astra/core dependencies
        run: npm ci --prefix packages/astra-core
      - name: Tolerance ratchet — a widened bound needs an ADR
        working-directory: backend
        run: python tools/check_tolerance_ratchet.py
      - name: Boundary-adversarial parity (assert the decision, not the float)
        # Constructs cases at measured distances from every categorical
        # boundary — sign, cusp, aspect orb cutoff, retrograde station — and
        # asserts the two engines classify identically outside the band the
        # contract excuses. Deterministic: same cases every run, no seed.
        working-directory: backend
        run: python tools/parity_boundary.py
      - name: Self-test — the suite must fail on a 1-arcminute bias
        # The acceptance criterion, run as a check rather than trusted. The
        # first version of this suite passed clean under this injection
        # because the knob it used landed downstream of the classifier; it
        # would have shipped with no teeth. Now the injection is upstream of
        # every decision and this step fails the build if the suite survives.
        working-directory: backend
        run: |
          if python tools/parity_boundary.py --kind sign --inject-bias-deg 0.0167; then
            echo "::error::parity_boundary SURVIVED a 1-arcminute injected bias — the suite has no teeth"
            exit 1
          fi
          echo "ok: the boundary suite goes red on a 1-arcminute bias"

  anchors-guard:
    name: "A3 — anchor provenance guard"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          # Need both sides of the PR to diff, and the commit messages to
          # look for the trailer — a shallow clone has neither.
          fetch-depth: 0
      - name: Anchor data may only change with an ANCHOR-CHANGE trailer
        # parity/anchors/ holds values sourced OUTSIDE this repository. Nothing
        # here may regenerate them, so an anchor diff is never routine: it is
        # either a new acquisition (fine, with provenance) or a value being
        # bent to make a build green (the failure mode this guard exists for).
        # Markdown is exempt — the runbook and README are meant to be edited.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE" "$HEAD" -- parity/anchors/ \
                    | grep -v '\.md$' || true)
          if [ -z "$changed" ]; then
            echo "ok: no anchor data touched"
            exit 0
          fi
          echo "anchor data changed in this PR:"
          echo "$changed" | sed 's/^/  /'
          if git log --format='%B' "$BASE".."$HEAD" | grep -q '^ANCHOR-CHANGE:'; then
            echo "ok: ANCHOR-CHANGE trailer present"
            git log --format='%B' "$BASE".."$HEAD" | grep '^ANCHOR-CHANGE:' | sed 's/^/  /'
          else
            echo "::error::Files under parity/anchors/ changed without an ANCHOR-CHANGE: trailer."
            echo "These values come from OUTSIDE this repository and are never regenerated here."
            echo "If this is a legitimate acquisition or correction, add a commit trailer:"
            echo "    ANCHOR-CHANGE: <what changed, which source, why>"
            echo "See parity/anchors/README.md."
            exit 1
          fi

  property-parity:
    name: "A1 — generative parity (Python ⇄ TS, N=2000)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/astra-core/package-lock.json
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install @astra/core dependencies
        run: npm ci --prefix packages/astra-core
      - name: Stratified generative parity — seeded from the run id
        # 2000 fresh cases per run, oversampling the hostile regions (polar
        # latitudes, sidereal, stations, JD rollover, local midnight). The
        # seed IS the run id: any red run replays locally with the printed
        # `--seed … --index …` command. The nine golden vectors stay as the
        # immutable regression anchors; this samples the space between them.
        working-directory: backend
        run: python tools/parity_property.py --n 2000 --seed ${{ github.run_id }}

  e2e:
    name: E2E — Playwright (desktop + mobile emulation)
    runs-on: ubuntu-latest
    env:
      # Development mode: boot guard permits the default secret, and the
      # minted test tokens validate against the same default-secret server.
      AAE_ENV: development
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install @astra/core deps (Vite bundles it for on-device casting)
        run: npm ci
        working-directory: packages/astra-core
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Pre-build backend venv (run.sh boots from .venv)
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.txt
      - name: Run e2e suite (boots run.sh itself)
        run: npm run e2e
        working-directory: frontend
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  secrets-scan:
    name: Gitleaks — secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # scan full history, not just the tip
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
