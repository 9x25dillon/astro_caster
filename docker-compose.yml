# Astra — production-style stack: backend image + built frontend served by nginx.
#   cp .env.example .env      # then edit (Ollama, secret, keys)
#   docker compose up --build
# Frontend on http://localhost:${WEB_PORT:-8080}; /api/* is proxied to backend.
name: astra

services:
  backend:
    build:
      context: ./backend
    image: astra-backend
    environment:
      # Real production MUST set AAE_ENV=production and a strong AAE_SECRET,
      # or the app fails closed and refuses to boot (see DEPLOY.md).
      AAE_ENV: ${AAE_ENV:-development}
      AAE_SECRET: ${AAE_SECRET:-}
      # AI provider routing (all optional — offline reflection is the fallback).
      AAE_AI_PROVIDER: ${AAE_AI_PROVIDER:-auto}
      # Ollama: OLLAMA_HOST from .env → the URL the backend reads. From inside a
      # container "localhost" is the container, so default to the host gateway.
      AAE_OLLAMA_URL: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      AAE_OLLAMA_MODEL: ${AAE_OLLAMA_MODEL:-qwen2.5:3b}
      AAE_OLLAMA_MODEL_DEEP: ${AAE_OLLAMA_MODEL_DEEP:-}
      # Cloud (OpenAI-compatible gateway).
      AAE_AI_API_KEY: ${AAE_AI_API_KEY:-}
      AAE_AI_BASE_URL: ${AAE_AI_BASE_URL:-}
      AAE_AI_MODEL: ${AAE_AI_MODEL:-}
      AAE_AI_MODEL_DEEP: ${AAE_AI_MODEL_DEEP:-}
      AAE_AI_MODEL_SUPPORTER: ${AAE_AI_MODEL_SUPPORTER:-}
      AAE_AI_MODEL_ORACLE: ${AAE_AI_MODEL_ORACLE:-}
      # Anthropic (Fable oracle reports / personal report / course) and OpenAI
      # (deck-plate images). These were MISSING from this list until 2026-08-11:
      # the container simply never received them, so every paid tier degraded to
      # the offline compiler on the server while looking completely healthy —
      # `ai_source: offline` is an honest field, but nothing about the deploy
      # would have told you the key was the reason.
      AAE_ANTHROPIC_API_KEY: ${AAE_ANTHROPIC_API_KEY:-}
      AAE_OPENAI_API_KEY: ${AAE_OPENAI_API_KEY:-}
      # Browser origin allowed to call the API. With the two-origin layout this
      # is the APP host only; the landing page never calls /api.
      AAE_CORS: ${AAE_CORS:-}
      AAE_DEV_TOKEN: ${AAE_DEV_TOKEN:-}
      # Premium voice + ephemeris data files (optional).
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      SE_EPHE_PATH: ${SE_EPHE_PATH:-}
      # Stripe. ALSO missing from this list until 2026-08-11, with the same
      # failure shape as the AI keys above: put the keys in .env, restart, and
      # /api/pricing keeps reporting card_available=false with nothing logged,
      # because stripe_available() correctly observes that the container has no
      # key. The rail degrades honestly — which is exactly what makes the
      # misconfiguration invisible.
      AAE_STRIPE_SECRET_KEY: ${AAE_STRIPE_SECRET_KEY:-}
      AAE_STRIPE_WEBHOOK_SECRET: ${AAE_STRIPE_WEBHOOK_SECRET:-}
      AAE_STRIPE_MODE: ${AAE_STRIPE_MODE:-}
      AAE_STRIPE_SUPPORTER_USD: ${AAE_STRIPE_SUPPORTER_USD:-}
      AAE_STRIPE_ORACLE_USD: ${AAE_STRIPE_ORACLE_USD:-}
      AAE_STRIPE_REPORT_USD: ${AAE_STRIPE_REPORT_USD:-}
      AAE_STRIPE_TIMEOUT: ${AAE_STRIPE_TIMEOUT:-}
      # The origin Stripe redirects a paying customer BACK to. Defaults in
      # main.py to http://127.0.0.1:5173 — harmless locally, and a broken
      # purchase for every real customer if it is not set in production. It has
      # to be the APP host: the return handler that mints the entitlement lives
      # in the PWA, not on the landing page.
      AAE_PUBLIC_URL: ${AAE_PUBLIC_URL:-}
      # Pinned empty, never passed through. Edition P grants oracle tier and
      # operator rights to EVERY request, and trust mode bypasses payment
      # verification — either one reaching production would give the whole
      # internet the paid product for free. Hardcoded rather than defaulted so
      # that a .env copied up from a dev machine cannot enable them.
      AAE_PERSONAL_MODE: ""
      AAE_TRUST_MODE: ""
      # Cost control. Defaults ($100/day) suit a funded deployment, not a fixed
      # prepaid balance — see .env.example before going live.
      AAE_GLOBAL_DAILY_USD: ${AAE_GLOBAL_DAILY_USD:-}
      AAE_USER_DAILY_USD: ${AAE_USER_DAILY_USD:-}
      # Safe to default ON here specifically: the backend below uses `expose:`,
      # never `ports:`, so nothing outside this compose network can reach it and
      # forge a forwarding header. Publish the backend and this must be revisited.
      AAE_TRUST_PROXY: ${AAE_TRUST_PROXY:-1}
    extra_hosts:
      # Lets AAE_OLLAMA_URL=host.docker.internal reach an Ollama on the host.
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-data:/app/data
      # Swiss Ephemeris data files. NOT baked into the image: `backend/ephe/` is
      # GITIGNORED, so a fresh clone (i.e. every deploy) does not have it, and
      # `COPY . .` in backend/Dockerfile silently produces an image with no
      # ephemeris at all.
      #
      # The consequence is not a rounding difference — CHIRON VANISHES. With no
      # SE_EPHE_PATH directory, ephemeris.py falls back to Moshier, which has no
      # asteroid data, and the chart comes back with 16 bodies instead of 17.
      # Every other body is bit-identical; only Chiron silently disappears,
      # which is exactly the kind of defect nobody notices until a user does.
      #
      # This vendored directory is COMMITTED and is the same file set
      # tests/conftest.py pins the parity vectors to, so production computes
      # what the drift-lock verifies. Read-only: the backend only reads it.
      - ./packages/astra-core/src/vendor/swisseph:/app/ephe:ro
    expose:
      - "8787"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: astra-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"
      - "${WEB_TLS_PORT:-8443}:443"
    volumes:
      # The Cloudflare Origin CA certificate, mounted rather than baked in: the
      # private key must never enter the image or the (public) repo. Absent
      # locally, so 40-ensure-cert.sh self-signs a throwaway and dev still
      # works. In production set WEB_PORT=80 and WEB_TLS_PORT=443.
      #
      # NOT :ro — deliberately. The self-signing fallback has to WRITE here on a
      # machine with no certificate, and a read-only mount turns that into
      # "container exits at boot" for anyone who just cloned the repo. The
      # script never touches an existing certificate, so the production key is
      # not at risk of being overwritten by it.
      - ./certs:/etc/nginx/certs
    restart: unless-stopped

volumes:
  backend-data:
