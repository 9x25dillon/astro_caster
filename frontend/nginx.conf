# Serve the Astra static bundle and proxy /api/* to the backend service, and
# serve the marketing landing page on its own hostname.
#
# M4 DEPLOY LAYOUT — decided 2026-08-11, two ORIGINS, not two paths:
#
#     astra-arcana.com      -> landing/index.html   (the pitch)
#     app.astra-arcana.com  -> frontend/dist        (the PWA)
#
# The obvious-looking alternative — landing at `/`, app at `/app/` on one host
# — is a trap, for two independent reasons:
#
#   1. The app's service worker registers with scope `/`. It would therefore
#      own the whole origin and answer a navigation to `/` from its precached
#      app shell, silently eating the landing page for every returning
#      visitor. Escaping that needs navigateFallbackDenylist + a narrowed
#      registration scope + Service-Worker-Allowed, all of which fail open.
#   2. `frontend/dist` is ALSO Capacitor's webDir, bundled inside the signed
#      APK and served there from the WebView's root. Rebasing Vite to `/app/`
#      would make the APK request `/app/assets/*` against a root that has no
#      such prefix — breaking a binary we cannot re-sign cheaply.
#
# Separate origins cost one extra DNS record and dodge both. They also keep
# the app's "zero off-origin requests" invariant (no-external.spec.ts) safe
# from anything marketing later bolts onto the landing page: a tracking pixel
# added to the pitch cannot reach the app's origin.
#
# Phase 2.5 — the security header set. NGINX GOTCHA: add_header directives are
# inherited from server{} ONLY by locations that declare none of their own, so
# every location that sets its own header (sw.js, /assets/) must repeat its own
# server's block verbatim. `test_edge_headers.py` gates this PER SERVER BLOCK.
#   - CSP: the app is self-contained by design (no-external.spec.ts proves no
#     off-origin requests) — everything pins to 'self'. 'wasm-unsafe-eval' is
#     the vendored Swiss-Ephemeris WASM; style 'unsafe-inline' is Vite/React
#     injected styles; data:/blob: images are deck plates & canvas exports;
#     blob: media is stitched TTS audio; geolocation stays available to the
#     app itself for the ceremony's location step.
#   - HSTS is honored only over TLS — inert in plain-HTTP dev, active behind
#     the terminating proxy (Cloudflare/VPS) in production.

# ---------------------------------------------------------------------------
# THE APP — app.astra-arcana.com
#
# Also the DEFAULT server, deliberately: `docker compose up` then
# http://localhost:${WEB_PORT} must still land on the app, exactly as it did
# before this file grew a second host. An unrecognised Host header gets the
# app, not the pitch.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    http2 on;
    server_name app.astra-arcana.com _;

    # TLS to the ORIGIN. Cloudflare runs in `strict`, so it verifies this
    # certificate — it is a Cloudflare Origin CA cert, trusted by Cloudflare
    # and by nothing else on earth, which is correct: nobody but Cloudflare is
    # allowed to reach this port (Hetzner firewall). Port 80 stays open for the
    # container healthcheck, not for traffic.
    #
    # The files are MOUNTED, never baked into the image or committed — the
    # private key must not live in a public repo. If none is mounted,
    # docker-entrypoint.d/40-ensure-cert.sh self-signs a throwaway so local
    # `docker compose up` still works; Cloudflare would reject that, which is
    # the point: a missing real cert must fail loudly in production, not
    # silently downgrade.
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    root /usr/share/nginx/html;
    index index.html;

    # Phase 2.5 — request size cap. Every request body is small JSON (birth
    # data, a question string); nothing in the app uploads files. 1m is
    # generous headroom over the largest real payload with no legitimate
    # use case pushing past it.
    client_max_body_size 1m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # gzip for the text assets (JS/CSS/JSON/SVG).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API → FastAPI backend (compose service name "backend"). depends_on with a
    # healthcheck guarantees the upstream is resolvable when nginx starts.
    location /api/ {
        proxy_pass http://backend:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/ai-ask-stream is Server-Sent Events — never buffer, allow long-lived.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # PWA service worker must always be revalidated, never long-cached.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        # security headers repeated: this location's add_header cancels inheritance
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        try_files $uri =404;
    }

    # Hashed build assets are immutable — cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # security headers repeated: this location's add_header cancels inheritance
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        try_files $uri =404;
    }

    # SPA fallback: every other route serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------------------
# THE LANDING PAGE — astra-arcana.com
#
# `landing.localhost` is in the name list so the pitch is reachable from a
# browser during local compose without hand-setting a Host header (browsers
# and systemd-resolved send *.localhost to 127.0.0.1).
#
# ⚠️ The APK's PURCHASE_URL is the immutable string
# `https://astra-arcana.com/#support`, compiled into a signed binary we cannot
# cheaply re-issue. It resolves to the `#support` anchor on THIS page, just
# above the pricing table. Serving something else at the apex breaks a
# shipped artifact. See frontend/src/lib/readerMode.ts.
#
# This host has NO /api/ proxy, on purpose: the landing page makes zero
# requests of any kind, so the payment and AI surface is not reachable from
# the marketing origin at all. Buying happens inside the app.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen 443 ssl;
    server_name astra-arcana.com www.astra-arcana.com landing.localhost;

    # Same origin certificate as the app host — it carries both
    # astra-arcana.com and *.astra-arcana.com as SANs, so one cert covers the
    # apex, www and app. (http2 is set once in the default_server block above;
    # repeating it here would be a duplicate-directive error.)
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    root /usr/share/nginx/landing;
    index index.html;

    client_max_body_size 1m;

    # Still stricter than the app's set. `script-src` was 'none' until this host
    # gained an offline fallback worker (sw.js -> TAPBLADE); it is now 'self',
    # which is the smallest step that permits it.
    #
    # That step costs far less than it looks. The threat this pins down is a
    # third-party snippet pasted onto the one page that publicly claims it makes
    # no external requests — and 'self' still blocks every off-origin script AND
    # every inline one. That is exactly why register-sw.js is its own file
    # rather than two inline lines: keeping the page free of inline script is
    # what lets 'unsafe-inline' stay out of this policy.
    #
    # form-action stays 'none' (no forms). connect-src becomes 'self' because a
    # service worker fetches its own assets; worker-src 'self' registers it.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The four policy pages have ONE source of truth — frontend/public/legal,
    # which the app build emits into dist/legal. They are linked at /legal/*
    # from the app (PricingPanel.tsx), from this page's footer, and from each
    # other; inside the APK the same paths resolve against the bundled copy.
    # Aliasing the app's copy rather than duplicating the files is what stops a
    # policy edit from landing on one host and not the other — which for a
    # refund window would be a real problem, not a cosmetic one.
    #
    # `root`, not `alias`: the URI prefix `/legal/` already matches the tail of
    # the target directory, so root composes the right path on its own — and
    # `try_files` inside an `alias` location is a long-standing nginx footgun
    # (the alias is not applied to the try_files candidates). nginx's own docs
    # say to prefer root whenever the last path component matches.
    location /legal/ {
        root /usr/share/nginx/html;
        # security headers repeated: this location's add_header cancels inheritance
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        try_files $uri =404;
    }

    # The offline fallback worker must always be revalidated. A long-cached
    # service worker is the worst thing to get wrong here: it keeps serving its
    # old fetch handler to returning visitors, and you cannot reach them to fix
    # it — the stale worker is what decides whether the new one is ever seen.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        # security headers repeated: this location's add_header cancels inheritance
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        try_files $uri =404;
    }

    # No SPA fallback here — this host is one static page plus its images.
    # A miss is a 404, not a silent redirect to the pitch.
    location / {
        try_files $uri $uri/ =404;
    }
}
